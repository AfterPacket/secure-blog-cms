# ============================================================
# Secure Blog CMS - Nginx Configuration
# ============================================================
#
# Pick ONE of the two server blocks below depending on your
# install path:
#
#   Option A — Root install:  https://yourdomain.com/
#   Option B — Subfolder:     https://yourdomain.com/blog/
#
# Copy the right block into your main nginx config or into
# /etc/nginx/sites-available/yourdomain.conf
#
# After editing, test and reload:
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================


# ============================================================
# OPTION A — Root install (https://yourdomain.com/)
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Redirect HTTP to HTTPS (uncomment if you have SSL)
    # return 301 https://$host$request_uri;

    root /var/www/html;
    index index.php index.html;

    # ---- SECURITY: Block access to sensitive directories ----
    location ~* ^/(data|includes|install)/ {
        # Block everything inside data/ and includes/
        # Also block install/ after setup is complete
        deny all;
    }

    # ---- SECURITY: Block sensitive file types ----
    location ~* \.(bak|old|tmp|log|md|txt|swp)$ {
        deny all;
    }

    # ---- SECURITY: Block config and version files ----
    location ~* /(config\.php|version\.json)$ {
        deny all;
    }

    # ---- Pretty URLs (WordPress-style) ----
    # Short URLs: /s/abc123
    location ~* ^/s/([a-zA-Z0-9]+)/?$ {
        try_files $uri /s.php?code=$1&$query_string;
    }

    # Category: /category/tech
    location ~* ^/category/([a-zA-Z0-9\-]+)/?$ {
        try_files $uri /index.php?category=$1&$query_string;
    }

    # Tag: /tag/mytag
    location ~* ^/tag/([a-zA-Z0-9\-]+)/?$ {
        try_files $uri /index.php?tag=$1&$query_string;
    }

    # Post: /post/my-slug
    location ~* ^/post/([a-zA-Z0-9\-]+)/?$ {
        try_files $uri /post.php?slug=$1&$query_string;
    }

    # Page: /page/2
    location ~* ^/page/([0-9]+)/?$ {
        try_files $uri /index.php?page=$1&$query_string;
    }

    # ---- PHP processing ----
    location ~ \.php$ {
        # IMPORTANT: Use the correct socket path for your system.
        # Common paths:
        #   Ubuntu/Debian: /run/php/php8.2-fpm.sock
        #   CentOS/RHEL:   /run/php-fpm/php-fpm.sock
        #   Alpine:        /run/php/php-fpm.sock
        # Check with: ls /run/php/  or  find /run -name "*fpm*sock*"
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS $https if_not_empty;

        include fastcgi_params;

        # Security: Don't let PHP serve files from data/ or includes/
        # (belt-and-suspenders; the location blocks above also block these)
        fastcgi_param PHP_VALUE "open_basedir=$document_root:/tmp";
    }

    # ---- Static files ----
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- Uploaded images (served via serve-image.php) ----
    # These go through PHP for security checks, no special handling needed.

    # ---- Default fallback ----
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---- Disable access log for static assets (optional) ----
    # access_log off;
}


